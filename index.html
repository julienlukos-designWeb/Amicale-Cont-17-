const [st,pr,tx,inf,pg,rc,dc,ac]=await Promise.all([sb.from("settings").select("*").eq("id",1).maybeSingle(),adm()?q("profiles","created_at",1):Promise.resolve({data:[]}),q("transactions","date"),q("infos","created_at"),q("pages","created_at"),q("receipts","date"),q("documents","created_at"),sb.rpc("active_count")]);

await sb.auth.signOut();lt="in";err="Compte créé ! Un administrateur doit le valider avant votre première connexion.";render()}
function form(title,fl,cb){$("dg").innerHTML=`<h2 style="margin:0 0 14px;font-size:18px">${title}</h2>`+fl.map(f=>{const id="f_"+f[0];return f[1]=="area"?`<textarea id="${id}" rows="3" placeholder="${f[2]}"></textarea>`:f[1]=="sel"?`<select id="${id}">${f[3].map(o=>`<option>${o}</option>`).join("")}</select>`:(f[1]=="date"||f[1]=="file"?`<div class="k" style="margin:2px 0 6px">${f[2]}</div>`:"")+`<input id="${id}" type="${f[1]}" ${f[1]=="file"?'accept="image/*,application/pdf"':`placeholder="${f[2]}"`}>`}).join("")+`<div class="rw" style="margin-top:6px"><button class="lnk" onclick="$('dg').close()">Annuler</button><button class="bt t1" id="ok">Enregistrer</button></div>`;
$("dg").showModal();$("ok").onclick=async()=>{const v={};for(const f of fl){const e=$("f_"+f[0]);v[f[0]]=f[1]=="file"?(e.files[0]||null):e.value.trim()}if(!v[fl[0][0]])return;$("ok").disabled=true;$("ok").textContent="Envoi…";try{await cb(v)}catch(x){fail(x)}$("dg").close();await loadAll();render()}}
const up=async f=>{if(!f)return null;if(f.size>8e6)throw new Error("Fichier trop volumineux (8 Mo max).");const p=U.id+"/"+Date.now()+"-"+f.name.replace(/[^\w.-]+/g,"_");const {error}=await sb.storage.from("files").upload(p,f,{contentType:f.type});if(error)throw error;return p};
const ins=async(t,o)=>{const {error}=await sb.from(t).insert(o);if(error)throw error};
const addTx=sg=>form(sg>0?"Nouvelle entrée":"Nouvelle dépense",[["l","text","Libellé"],["m","number","Montant (FCFA)"],["c","area","Description"]],v=>ins("transactions",{label:v.l,description:v.c,amount:sg*Math.abs(+v.m||0),date:today()}));
const addInf=()=>form("Nouvelle info",[["t","text","Titre"],["c","area","Message"]],v=>ins("infos",{title:v.t,content:v.c}));
const addRec=()=>form("Nouveau justificatif",[["t","text","Titre (ex. Reçu de versement)"],["k","sel","",["Recette","Dépense"]],["m","number","Montant (FCFA)"],["dt","date","Date"],["c","area","Description"],["f","file","Fichier (image ou PDF)"]],async v=>ins("receipts",{title:v.t,kind:v.k,amount:Math.abs(+v.m||0),date:v.dt||today(),description:v.c,file_path:await up(v.f)}));
const addDoc=()=>form("Nouveau document",[["t","text","Titre"],["c","area","Description"],["f","file","Fichier (image ou PDF)"]],async v=>ins("documents",{title:v.t,description:v.c,file_path:await up(v.f)}));
const addPag=()=>form("Nouvelle page",[["t","text","Titre"],["c","area","Contenu"]],v=>ins("pages",{title:v.t,content:v.c}));
const TB={tx:"transactions",infos:"infos",pages:"pages",recus:"receipts",docs:"documents"};
const del=async(k,i)=>{if(!confirm("Supprimer ?"))return;const x=S[k][i],{error}=await sb.from(TB[k]).delete().eq("id",x.id);if(fail(error))return;if(x.u)await sb.storage.from("files").remove([x.u]);await loadAll();render()};
const saveSet=async()=>{const {error}=await sb.from("settings").update({name:$("nm").value||S.name,tagline:$("tg").value}).eq("id",1);if(fail(error))return;await loadAll();render()};
const rmLogo=async()=>{await sb.from("settings").update({logo:""}).eq("id",1);await loadAll();render()};
const out=async()=>{await sb.auth.signOut();U=null;sheet=0;S.users=[];render()};
const isP=u=>(u||"").toLowerCase().endsWith(".pdf");
const pdfShow=async u=>{const p=$("pv");try{pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";const {data,error}=await sb.storage.from("files").download(u);if(error)throw error;const d=await pdfjsLib.getDocument({data:new Uint8Array(await data.arrayBuffer())}).promise;p.innerHTML="";for(let n=1;n<=d.numPages;n++){const pg=await d.getPage(n),vp=pg.getViewport({scale:1.6}),c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;c.style.cssText="width:100%;border-radius:12px;margin-bottom:10px;-webkit-touch-callout:none;user-select:none";c.oncontextmenu=()=>false;p.appendChild(c);await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise}}catch(e){p.textContent="Impossible d’afficher ce PDF."}};
const viewF=(k,i)=>{const x=S[k][i];$("dg").innerHTML=`<h2 style="margin:0 0 6px;font-size:18px">${esc(x.t)}</h2>${x.m!=null?`<div class="${x.k=="Dépense"?"ko":"ok"}" style="font-size:20px">${fc(x.m)}</div>`:""}${x.c?`<p class="sub" style="margin:6px 0">${esc(x.c)}</p>`:""}${x.u?(isP(x.u)?'<div id="pv" class="sub" style="margin:10px 0">Chargement…</div>':`<img src="${x.url}" alt="" draggable="false" oncontextmenu="return false" style="width:100%;border-radius:14px;margin:10px 0;-webkit-touch-callout:none;user-select:none">`):""}<button class="bt t4 s" onclick="$('dg').close()">Fermer</button>`;$("dg").showModal();if(isP(x.u))pdfShow(x.u)};
function setLogo(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),s=Math.min(1,200/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);S.logo=c.toDataURL("image/png");sb.from("settings").update({logo:S.logo}).eq("id",1).then(({error})=>{fail(error);render()})};im.src=r.result};r.readAsDataURL(f)}
const setSt=async(i,st)=>{const {error}=await sb.from("profiles").update({status:st}).eq("id",S.users[i].id);if(fail(error))return;await loadAll();render()};
const dec=(i,ok)=>setSt(i,ok?"active":"rejected");
const delU=async i=>{if(!confirm("Supprimer ce compte ?"))return;const {error}=await sb.rpc("admin_delete_user",{uid:S.users[i].id});if(fail(error))return;await loadAll();render()};
const stt=u=>u.pend?"En attente":u.rej?"Rejeté":u.on?"Actif":"Désactivé";
const head=(t,fn,s)=>`<div class="rw" style="margin-bottom:16px"><div><h1 style="margin:0">${t}</h1>${s?`<p class="sub" style="margin:2px 0 0">${s}</p>`:""}</div>${adm()&&fn?`<button class="bt t1 s" onclick="${fn}()">${ic("plus",16)}Ajouter</button>`:""}</div>`;
const txRows=(n,d)=>[...S.tx].sort((a,b)=>b.d.localeCompare(a.d)).slice(0,n).map(t=>`<div class="ro"><span class="ic ${t.m<0?"out":"in"}">${ic(t.m<0?"down":"up",18)}</span><div class="m"><b>${esc(t.l)}</b><span>${fd(t.d)}${t.c?" · "+esc(t.c):""}</span></div><span class="${t.m<0?"ko":"ok"}">${t.m<0?"−":"+"}${fc(Math.abs(t.m))}</span>${d&&adm()?`<button class="ib" onclick="del('tx',${S.tx.indexOf(t)})">${ic("trash",17)}</button>`:""}</div>`).join("")||'<p class="sub">Aucune opération.</p>';
const empty='<p class="sub" style="margin:0">Rien pour le moment.</p>';
const textList=k=>`<div class="card">${S[k].map((x,i)=>`<div class="ro" style="align-items:flex-start"><span class="ic">${ic(k=="infos"?"mega":"book",18)}</span><div class="m"><b>${esc(x.t)}</b><span>${fd(x.d)}</span><p style="margin:6px 0 0">${esc(x.c)}</p></div>${adm()?`<button class="ib" onclick="del('${k}',${i})">${ic("trash",17)}</button>`:""}</div>`).join("")||empty}</div>`;
const V={
dash(){const ent=sum(t=>t.m>0),dep=-sum(t=>t.m<0),mo={};S.tx.forEach(t=>{const k=t.d.slice(0,7);(mo[k]=mo[k]||[0,0])[t.m>0?0:1]+=Math.abs(t.m)});
const ks=Object.keys(mo).sort().slice(-6),mx=Math.max(...ks.map(k=>Math.max(...mo[k])),1),li=S.infos[0],pc=S.users.filter(u=>u.pend).length;
const b=(c,f,i,t)=>`<button class="bt ${c}" onclick="${f}">${ic(i,17)}${t}</button>`;
return `<p class="sub" style="margin:0;text-transform:capitalize">${new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}</p><h1 style="margin-bottom:14px">Bonjour, ${esc(U.n.split(" ")[0])}</h1>
<div class="hero"><small>Solde en caisse</small><div class="bal">${fc(ent-dep)}</div><div class="hs"><div>Entrées<b>${fc(ent)}</b></div><div>Dépenses<b>${fc(dep)}</b></div></div></div>
${adm()?`<div class="bts">${b("t1","addTx(1)","up","Entrée")}${b("t2","addTx(-1)","down","Dépense")}${b("t3","addRec()","receipt","Justificatif")}${b("t4","addInf()","mega","Info")}</div>`:""}
${adm()&&pc?`<div class="card rw" onclick="go('mem')" style="cursor:pointer;border-color:#d9a441;flex-wrap:nowrap"><span class="ic">${ic("users",19)}</span><div style="flex:1"><b>${pc} demande${pc>1?"s":""} de compte</b><div class="sub" style="margin:0">À valider ou rejeter</div></div>${ic("check",18)}</div>`:""}
<div class="g2"><div class="card"><div class="k">Membres actifs</div><div class="v">${S.nActive}</div></div><div class="card"><div class="k">Justificatifs</div><div class="v">${S.recus.length}</div></div></div>
${li?`<div class="card rw" onclick="go('inf')" style="cursor:pointer;flex-wrap:nowrap"><span class="ic">${ic("mega",19)}</span><div style="flex:1;min-width:0"><div class="k">Dernière info</div><b>${esc(li.t)}</b></div><span class="lnk">Lire</span></div>`:""}
<div class="card"><div class="rw"><div><b>Entrées et dépenses</b><div class="sub" style="margin:0;font-size:13px">6 derniers mois</div></div><div class="lg2"><span><i style="background:#0f9d74"></i>Entrées</span><span><i style="background:#e0483d"></i>Dépenses</span></div></div>
<div class="ch">${ks.map(k=>`<div><div class="p"><i style="height:${mo[k][0]/mx*96}px;background:linear-gradient(#34d399,#0f9d74)"></i><i style="height:${mo[k][1]/mx*96}px;background:linear-gradient(#fb7a6c,#e0483d)"></i></div>${k.slice(5)}/${k.slice(2,4)}</div>`).join("")}</div></div>
<div class="sec"><b>Dernières opérations</b><button class="lnk" onclick="go('cai')">Tout voir</button></div><div class="card">${txRows(5)}</div>`},
cai(){const e=sum(t=>t.m>0),d=-sum(t=>t.m<0);return head("Caisse","","Suivi du budget en caisse")+`<div class="hero"><small>Solde actuel</small><div class="bal" style="margin-bottom:${adm()?16:0}px">${fc(e-d)}</div>${adm()?`<div class="bts" style="margin:0"><button class="bt t1 s" onclick="addTx(1)">${ic("up",16)}Entrée</button><button class="bt t2 s" onclick="addTx(-1)">${ic("down",16)}Dépense</button></div>`:""}</div><div class="card">${txRows(999,1)}</div>`},
inf(){return head("Infos","addInf","Annonces de l’amicale")+textList("infos")},
pag(){return head("Pages","addPag","Pages d’information")+textList("pages")},
doc(){return head("Documents","addDoc","Statuts, procès-verbaux et rapports")+`<div class="card">${S.docs.map((x,i)=>`<div class="ro"><span class="ic">${ic("file",18)}</span><div class="m"><b>${esc(x.t)}</b><span>${fd(x.d)}${x.c?" · "+esc(x.c):""}</span></div>${x.u?`<button class="bt t4 s" onclick="viewF('docs',${i})">${ic("eye",15)}Voir</button>`:""}${adm()?`<button class="ib" onclick="del('docs',${i})">${ic("trash",17)}</button>`:""}</div>`).join("")||empty}</div>`},
rec(){const R=S.recus,f=R.filter(x=>rf=="all"||x.k==rf),n=k=>R.filter(x=>x.k==k).length,ch=(k,l,c)=>`<button class="${rf==k?"on":""}" onclick="rf='${k}';render()">${l}<span>${c}</span></button>`;
return head("Justificatifs","addRec","Reçus et factures des recettes et dépenses")+`<div class="seg">${ch("all","Tout",R.length)}${ch("Recette","Recettes",n("Recette"))}${ch("Dépense","Dépenses",n("Dépense"))}</div><div class="rg">${f.map(x=>{const i=R.indexOf(x),dp=x.k=="Dépense";return `<div class="rc"><div class="ph">${x.u&&!isP(x.u)?`<img src="${x.url}" alt="" draggable="false" oncontextmenu="return false">`:ic(x.u?"file":"receipt",34)}<span class="bd ${dp?"dp":""}">${x.k}</span></div><div class="rb"><b>${esc(x.t)}</b><div class="${dp?"ko":"ok"}" style="font-size:17px;margin:2px 0">${fc(x.m)}</div><div class="sub" style="margin:0;font-size:13px">${fd(x.d)}</div>${x.c?`<p class="cl">${esc(x.c)}</p>`:""}<div class="rw" style="margin-top:10px;flex-wrap:nowrap"><button class="bt t4 s" onclick="viewF('recus',${i})">${ic("eye",15)}Voir</button>${adm()?`<button class="ib" onclick="del('recus',${i})">${ic("trash",17)}</button>`:""}</div></div></div>`}).join("")||empty}</div>`},
mem(){if(!adm())return"";const p=S.users.map((u,i)=>[u,i]).filter(x=>x[0].pend);
return head("Membres","","Comptes et accès à la plateforme")+(p.length?`<div class="card" style="border-color:#d9a441"><b>Demandes en attente (${p.length})</b>${p.map(([u,i])=>`<div class="ro"><div class="av">${ini(u.n)}</div><div class="m"><b>${esc(u.n)}</b><span>${esc(u.p)}</span></div><button class="bt t1 s" onclick="dec(${i},1)">Valider</button><button class="bt t2 s" onclick="dec(${i},0)">Rejeter</button></div>`).join("")}</div>`:"")+
`<div class="card">${S.users.map((u,i)=>`<div class="ro"><div class="av">${ini(u.n)}</div><div class="m"><b>${esc(u.n)}</b><span>${esc(u.p)} · ${u.r=="admin"?"Administrateur":"Membre"}</span></div><span class="tg ${u.pend?"w":u.on?"":"x"}">${stt(u)}</span>${u.r=="admin"?"":`${u.pend?"":`<button class="lnk" onclick="setSt(${i},'${u.on?"disabled":"active"}')">${u.on?"Désactiver":"Activer"}</button>`}<button class="ib" onclick="delU(${i})">${ic("trash",17)}</button>`}</div>`).join("")}</div>`},
par(){if(!adm())return"";return head("Paramètres","","Personnalisez la plateforme")+`<div class="card"><b>Logo</b><div class="rw" style="justify-content:flex-start;margin:12px 0;flex-wrap:nowrap">${lg(64)}<input type="file" accept="image/*" onchange="setLogo(this)" style="margin:0"></div>${S.logo?`<button class="lnk" onclick="rmLogo()">Retirer le logo</button>`:""}</div><div class="card"><div class="k" style="margin-bottom:6px">Nom de la plateforme</div><input id="nm" value="${esc(S.name)}"><div class="k" style="margin-bottom:6px">Slogan</div><input id="tg" value="${esc(S.tag)}"><button class="bt t1" onclick="saveSet()">Enregistrer</button></div>`}};
boot();
</script>
</body>
</html>
