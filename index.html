<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1d21">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="A.M.D">
<title>Amicale Contingents 17</title>
<style>
:root{--bg:#0b0d12;--tx:#f3f5fa;--mu:#9aa3b5;--bd:rgba(255,255,255,.08);--ln:rgba(255,255,255,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;min-height:100vh;background:radial-gradient(800px 480px at 0% -8%,rgba(37,99,235,.28),transparent 60%),radial-gradient(700px 420px at 100% 0%,rgba(21,128,61,.22),transparent 60%),var(--bg);background-attachment:fixed}
button,input,select{font-family:inherit}
.top{position:sticky;top:0;z-index:5;height:64px;display:flex;align-items:center;gap:10px;padding:0 10px;background:rgba(14,17,24,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--bd)}
.ic{width:44px;height:44px;border:0;background:rgba(255,255,255,.07);border-radius:14px;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.lg{display:flex;align-items:center;gap:10px;min-width:0}
.lg>div{min-width:0}.lg b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lg span{display:block;font-size:11px;color:var(--mu)}
.ic{position:relative}
.bdg{margin-left:auto;background:#ef4444;color:#fff;border-radius:999px;min-width:22px;height:22px;padding:0 7px;font-size:12px;font-weight:700;display:none;align-items:center;justify-content:center}
.dot{position:absolute;top:7px;right:7px;width:12px;height:12px;border-radius:50%;background:#ef4444;border:2px solid #14171f;display:none}
.lo{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#facc15,#c2410c);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#1c1917;font-style:normal;flex:none;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.18)}
.lo img,.big img{width:100%;height:100%;object-fit:cover}
.pg{max-width:560px;margin:0 auto;padding:18px 16px 8px;display:flex;flex-direction:column;gap:14px}
.pg>*{animation:up .4s ease both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.c{border-radius:20px;padding:16px 18px;background:linear-gradient(160deg,#1b2130,#141822);border:1px solid var(--bd);box-shadow:0 10px 28px rgba(0,0,0,.35)}
.s{font-size:12px;color:var(--mu)}
.m{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{border-radius:999px;padding:5px 11px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap}
.b{--c:#2563eb;--d:#1e3a8a;display:flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:15px;color:#fff;font-weight:700;font-size:15px;letter-spacing:.2px;min-height:54px;padding:0 16px;margin-bottom:6px;text-shadow:0 1px 0 rgba(0,0,0,.28);
 background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 55%),var(--c);
 box-shadow:0 6px 0 var(--d),0 14px 20px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .08s,box-shadow .08s}
.b:active{transform:translateY(5px);box-shadow:0 1px 0 var(--d),0 4px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.25)}
.sm{min-height:42px!important;font-size:13px!important;padding:0 12px!important}
.wide{grid-column:1/-1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.q{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.st{padding:13px 14px}.st b{display:block;font-size:17px;margin-top:6px}
.f{width:100%;border:1px solid rgba(255,255,255,.13);border-radius:12px;background:#0f131b;color:var(--tx);font-size:15px;padding:12px 14px;min-height:48px;margin-top:6px}
.f:focus{outline:2px solid #3b82f6;outline-offset:1px}
select.f{appearance:auto}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.06);border-radius:14px;padding:5px}
.tabs button{flex:1;min-height:44px;border:0;border-radius:10px;font-weight:700;font-size:13px;background:none;color:var(--mu)}
.tabs button.on{background:#2563eb;color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.45)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd);font-size:14px}.row:last-child{border:0}
.ft{text-align:center;font-size:11px;color:var(--mu);padding:16px 16px 26px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:8}
.ov.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;bottom:0;left:0;width:290px;max-width:86%;background:#11141c;border-right:1px solid var(--bd);z-index:9;transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;padding:14px 0;box-shadow:10px 0 40px rgba(0,0,0,.6);overflow-y:auto}
.dr.on{transform:none}
.dh{display:flex;align-items:center;gap:12px;padding:6px 18px 16px;margin-bottom:6px;border-bottom:1px solid var(--bd)}
.dh b{font-size:14px;line-height:1.3}
.dr .i{height:46px;display:flex;align-items:center;gap:14px;margin:2px 10px;padding:0 14px;border:0;border-radius:12px;background:none;color:#d6dbe6;font-size:14px;text-align:left;width:calc(100% - 20px)}
.dr .i.a{background:linear-gradient(90deg,rgba(37,99,235,.38),rgba(37,99,235,.06));color:#fff;font-weight:700}
.dr .sp{margin-top:auto;padding:12px 20px 0;font-size:11px;color:var(--mu)}
.ctr{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:420px;margin:0 auto;padding:28px 20px;text-align:center}
.big{width:96px;height:96px;margin:0 auto;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#facc15,#c2410c);display:flex;align-items:center;justify-content:center;font-weight:800;color:#1c1917;box-shadow:0 0 0 4px rgba(255,255,255,.12),0 14px 30px rgba(0,0,0,.4)}
.err{background:#7f1d1d;color:#fecaca;border-radius:12px;padding:10px 12px;font-size:13px}
.left{text-align:left}
.opt{display:flex;align-items:center;gap:12px;min-height:50px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px}
.opt input{width:22px;height:22px;accent-color:#22c55e;flex:none}.opt em{margin-left:auto;font-size:12px;color:var(--mu);font-style:normal;text-align:right}.opt.off{opacity:.45}
.stat{flex-direction:column;gap:3px;min-height:86px;padding:10px 6px;font-weight:600;text-align:center}.stat span{font-size:11px;opacity:.92}.stat b{font-size:19px}
.ph{width:84px;height:104px;border-radius:14px;object-fit:cover;background:#2a2f3d;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mu)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB = supabase.createClient('https://fwodbaildriqkmpplutj.supabase.co', 'sb_publishable_yDfRe6HmyHgGVo1AuuosYg_h9LDlWLA');
const SLOGAN = 'Foula - Fiit - Fayda';
let BR = { name: 'A.M.D', logo: 'logo.png' };
const logo = () => BR.logo ? `<img src="${esc(BR.logo)}" alt="Logo" onerror="this.outerHTML='Logo'">` : 'Logo';
const FOOT = 'Administrateur et créateur: Julien D. Y. LUKOS';
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits = p => String(p).replace(/\D/g, '');
const mail = p => digits(p) + '@amicale-c17.com';
let me = null, page = 'home', menu = false, tab = 'in', msg = '';
const isAdm = () => me && ['admin', 'owner'].includes(me.role);
const isOwn = () => me && me.role === 'owner';
const BURGER = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>';
const COL = {teal:['#0f766e','#134e4a'], blue:['#2563eb','#1e3a8a'], green:['#15803d','#14532d'], red:['#b91c1c','#7f1d1d'], gray:['#4b5563','#1f2937'], vio:['#7c3aed','#4c1d95'], or:['#c2410c','#7c2d12']};
const btn = (t, fn, c) => `<button class="b" style="--c:${COL[c][0]};--d:${COL[c][1]}" onclick="${fn}">${t}</button>`;
const IC = { home: 'M3 11l9-8 9 8v10a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z', user: 'M12 12a4 4 0 100-8 4 4 0 000 8zM4 21a8 8 0 0116 0', wallet: 'M3 7h16a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2zM3 7l2-3h12M16 14h2', users: 'M9 11a3.5 3.5 0 100-7 3.5 3.5 0 000 7zM2 20a7 7 0 0114 0M17 4a3.5 3.5 0 010 7M22 20a7 7 0 00-4-6', inbox: 'M4 13l2-8h12l2 8M4 13v6h16v-6M4 13h5l1 2h4l1-2h5', list: 'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01', gear: 'M12 15a3 3 0 100-6 3 3 0 000 6zM12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2', out: 'M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9' };
const ico = n => `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${IC[n]}"/></svg>`;

async function loadBrand() {
  const { data } = await SB.from('amicale_settings').select('key,value').in('key', ['amicale_name', 'amicale_logo']);
  (data || []).forEach(r => { if (r.key === 'amicale_name' && r.value) BR.name = r.value; if (r.key === 'amicale_logo') BR.logo = r.value || 'logo.png'; });
  document.title = BR.name;
}
async function boot() {
  await loadBrand();
  const { data: { session } } = await SB.auth.getSession();
  me = null;
  if (session) {
    const { data } = await SB.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
    me = data;
    if (!me) { await SB.auth.signOut(); msg = 'Compte introuvable. Crée un compte.'; }
  }
  render();
}

function authView() {
  const up = tab === 'up';
  return `<div class="ctr"><div class="big">${logo()}</div><div style="font-weight:800;font-size:17px">${esc(BR.name)}</div><div class="s">${SLOGAN}</div>
  <div class="tabs"><button class="${up ? '' : 'on'}" onclick="setTab('in')">Connexion</button><button class="${up ? 'on' : ''}" onclick="setTab('up')">Créer un compte</button></div>
  ${msg ? `<div class="err" role="alert">${esc(msg)}</div>` : ''}
  <form class="left" onsubmit="${up ? 'signup' : 'signin'}(event)">
  ${up ? `<label class="s">Prénom<input class="f" name="fn" required autocomplete="given-name"></label><label class="s" style="display:block;margin-top:10px">Nom (chiffres acceptés, ex. : Sarr N°1)<input class="f" name="ln" required autocomplete="family-name" placeholder="Sarr N°1"></label>` : ''}
  <label class="s" style="display:block;margin-top:10px">Numéro de téléphone<input class="f" name="ph" type="tel" required autocomplete="tel"></label>
  <label class="s" style="display:block;margin-top:10px">Mot de passe${up ? ' (6 caractères minimum)' : ''}<input class="f" name="pw" type="password" required minlength="6" autocomplete="${up ? 'new-password' : 'current-password'}"></label>
  <button class="b" style="width:100%;margin-top:18px;--c:${up ? '#15803d' : '#2563eb'};--d:${up ? '#14532d' : '#1e3a8a'}">${up ? 'Créer mon compte' : 'Se connecter'}</button></form>
  ${up ? '<div class="s">Un administrateur validera ton compte avant ta première connexion.</div>' : ''}
  <div class="ft">${FOOT}</div></div>`;
}
function setTab(t) { tab = t; msg = ''; render(); }
async function signin(e) {
  e.preventDefault(); const f = new FormData(e.target);
  const { error } = await SB.auth.signInWithPassword({ email: mail(f.get('ph')), password: f.get('pw') });
  if (error) { msg = 'Numéro ou mot de passe incorrect.'; return render(); }
  msg = ''; boot();
}
async function signup(e) {
  e.preventDefault(); const f = new FormData(e.target); const ph = digits(f.get('ph'));
  if (ph.length < 6) { msg = 'Numéro de téléphone invalide.'; return render(); }
  const { error } = await SB.auth.signUp({ email: mail(ph), password: f.get('pw'),
    options: { data: { first_name: f.get('fn').trim(), last_name: f.get('ln').trim(), phone: ph } } });
  if (error) { msg = /registered|already/i.test(error.message) ? 'Ce numéro est déjà inscrit.' : error.message; return render(); }
  msg = ''; boot();
}
async function logout() { await SB.auth.signOut(); me = null; menu = false; page = 'home'; tab = 'in'; render(); }

function stateView(icon, titre, texte) {
  return `<div class="ctr"><div class="big">${logo()}</div><div style="font-weight:800;font-size:17px">${esc(BR.name)}</div>
  <div class="c" style="background:linear-gradient(135deg,#b45309,#78350f);padding:24px 20px"><div style="font-weight:800;font-size:19px">${titre}</div><div style="font-size:14px;color:#fde68a;margin-top:8px;line-height:1.5">${texte}</div></div>
  ${btn('Actualiser', 'boot()', 'blue')}${btn('Se déconnecter', 'logout()', 'gray')}<div class="ft">${FOOT}</div></div>`;
}

const TITRES = { settings: 'Paramètres', home: 'Accueil', profile: 'Mon profil', budget: 'État du budget', situation: 'Situation des membres', requests: "Demandes d'inscription", members: 'Membres' };
const stat = (l, v, fn, c) => `<button class="b stat" style="--c:${COL[c][0]};--d:${COL[c][1]}" onclick="${fn}"><span>${l}</span><b>${v}</b></button>`;
Object.assign(IC, { star: 'M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z', bell: 'M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 004 0', doc: 'M7 3h8l4 4v14H7zM15 3v4h4M10 12h6M10 16h6', image: 'M4 5h16v14H4zM4 15l5-5 4 4 3-3 4 4M9 9h.01', cal: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4', heart: 'M12 21s-8-5-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 6-8 11-8 11z', mega: 'M3 11v3h4l8 5V6L7 11zM18 9a4 4 0 010 6' });
const PK = { honneur: { t: "Page d'honneur", ex: 'Titre ou année', thumb: 1 }, rappel: { t: 'Rappel important' }, annonce: { t: 'Annonces' }, statuts: { t: 'Statuts', pdf: 1 }, reglement: { t: 'Règlement intérieur', pdf: 1 }, image: { t: "Images de l'amicale", noTitle: 1 }, morts: { t: 'À nos morts', ex: 'Naissance – Décès', thumb: 1 } };
Object.keys(PK).forEach(k => TITRES[k] = PK[k].t); TITRES.event = 'Situation du membre';
const EVL = { fiancailles: 'Fiançailles', mariage: 'Mariage', circoncision: 'Circoncision', communion: 'Communion', bapteme: 'Baptême', deces: 'Décès' };
const REL = { pere: 'Père', mere: 'Mère', enfant: 'Enfant', conjoint: 'Conjoint(e)' };
function go(p) { page = p; menu = false; render(); }
function tog() { menu = !menu; $('.dr').classList.toggle('on', menu); $('.ov').classList.toggle('on', menu); }
function item(p, t, ic) { return `<button class="i ${page === p ? 'a' : ''}" onclick="go('${p}')">${ico(ic)}${t}</button>`; }

function render() {
  const a = $('#app');
  if (!me) { a.innerHTML = authView(); return; }
  const m = { pending: ['Compte en attente de validation', `Bonjour ${esc(me.first_name)}, ta demande a bien été envoyée. Un administrateur va la valider. Tu pourras alors accéder à la plateforme.`],
    rejected: ['Demande rejetée', 'Ta demande d\'inscription a été rejetée. Contacte un administrateur de l\'amicale.'],
    disabled: ['Compte désactivé', 'Ton compte est désactivé. Contacte un administrateur pour le réactiver.'],
    deleted: ['Compte supprimé', 'Ce compte n\'est plus actif. Contacte un administrateur de l\'amicale.'] }[me.status];
  if (m) { a.innerHTML = stateView('', m[0], m[1]); return; }
  a.innerHTML = `<div class="top"><button class="ic" onclick="tog()" aria-label="Menu">${BURGER}<span class="dot" id="bd-dot"></span></button><div class="lg"><i class="lo">${logo()}</i><div><b>${esc(BR.name)}</b><span>${TITRES[page]}</span></div></div></div>
  <main id="c" class="pg"><div class="s">Chargement…</div></main><div class="ft">${FOOT}</div>
  <div class="ov ${menu ? 'on' : ''}" onclick="tog()"></div>
  <nav class="dr ${menu ? 'on' : ''}"><div class="dh"><i class="lo" style="width:46px;height:46px">${logo()}</i><b>${esc(BR.name)}</b></div>
  ${item('home', 'Accueil', 'home')}${item('profile', 'Mon profil', 'user')}${item('honneur', "Page d'honneur", 'star')}${item('rappel', 'Rappel important', 'bell')}${item('annonce', 'Annonces', 'mega')}${item('statuts', 'Statuts', 'doc')}${item('reglement', 'Règlement intérieur', 'doc')}${item('budget', 'État du budget', 'wallet')}${item('situation', 'Situation des membres', 'users')}${item('image', "Images de l'amicale", 'image')}${item('morts', 'À nos morts', 'heart')}
  ${isAdm() ? `<button class="i ${page === 'requests' ? 'a' : ''}" onclick="go('requests')">${ico('inbox')}Demandes d'inscription<span class="bdg" id="bd-req"></span></button>` + item('members', 'Membres', 'list') + item('settings', 'Paramètres', 'gear') : ''}
  <button class="i" onclick="logout()">${ico('out')}Se déconnecter</button><div class="sp">${FOOT}</div></nav>`;
  setBadges(); refreshPending(); fill();
}

async function fill() {
  const c = $('#c'); let h = '';
  if (page === 'home') h = await homeV();
  else if (page === 'profile') h = await profileV();
  else if (page === 'settings') h = await settingsV();
  else if (page === 'budget') h = await budgetV();
  else if (page === 'situation') h = await situationV();
  else if (page === 'event') h = await eventV();
  else if (PK[page]) h = await postsV(page);
  else if (page === 'requests') h = await listV(['pending', 'rejected'], true);
  else h = await listV(['active', 'disabled', 'deleted'], false);
  if (c) c.innerHTML = h;
}

const ST = { pending: ['En attente', '#c2410c'], rejected: ['Rejeté', '#b91c1c'], active: ['Actif', '#15803d'], disabled: ['Désactivé', '#4b5563'], deleted: ['Supprimé', '#b91c1c'] };
const RL = { owner: ['Propriétaire', '#b45309'], admin: ['Administrateur', '#7c3aed'] };
async function listV(statuses, req) {
  const { data, error } = await SB.from('profiles').select('*').in('status', statuses).order('created_at', { ascending: false });
  if (error) return `<div class="err">${esc(error.message)}</div>`;
  if (!data.length) return `<div class="c s">${req ? 'Aucune demande en attente.' : 'Aucun membre.'}</div>`;
  MB = {}; data.forEach(p => MB[p.id] = p);
  const rows = data.map(p => {
    const t = RL[p.role] || ST[p.status], who = `<div><div style="font-weight:700">${esc(p.first_name)} ${esc(p.last_name)}</div><div class="s">${esc(p.phone)}</div></div>`;
    let ac = '';
    if (p.id === me.id) ac = '';
    else if (p.status === 'pending') ac = `<div class="g2">${btn('Valider', `act('${p.id}','active')`, 'green')}${btn('Rejeter', `act('${p.id}','rejected')`, 'red')}</div>`;
    else if (p.status === 'rejected') ac = `<div style="margin-top:12px">${btn('Valider quand même', `act('${p.id}','active')`, 'green')}</div>`;
    else if (p.role === 'owner') ac = '';
    else if (p.status === 'active') ac = `<div class="g2">${btn('Désactiver', `act('${p.id}','disabled')`, 'gray')}${isOwn() ? btn(p.role === 'admin' ? 'Retirer admin' : 'Nommer admin', `setRole('${p.id}','${p.role === 'admin' ? 'member' : 'admin'}')`, 'vio') : ''}</div>`;
    else ac = `<div class="g2">${btn(p.status === 'deleted' ? 'Restaurer' : 'Réactiver', `act('${p.id}','active')`, 'green')}</div>`;
    if (isOwn() && p.id !== me.id && p.role !== 'owner' && ['active', 'disabled'].includes(p.status))
      ac += `<div style="margin-top:12px">${btn('Supprimer', `del('${p.id}')`, 'red')}</div>`;
    if (isOwn() && p.id !== me.id && p.role !== 'owner' && ['deleted', 'rejected'].includes(p.status))
      ac += `<div style="margin-top:12px">${btn('Supprimer définitivement', `purge('${p.id}')`, 'red')}</div>`;
    if (p.role !== 'owner' || isOwn())
      ac += `<div style="margin-top:12px">${btnS('Modifier le nom', `renameMember('${p.id}')`, 'gray')}</div>`;

  <div class="c" style="padding-top:8px;padding-bottom:8px"><div style="font-weight:700;padding:6px 0">Cotisations ${YEAR}</div>${tr(1)}${tr(2)}</div>
  ${evl ? `<div class="c" style="padding-top:8px;padding-bottom:8px"><div style="font-weight:700;padding:6px 0">Événements enregistrés</div>${evl}</div>` : ''}
  <form class="c" onsubmit="addEvent(event)" style="padding-top:8px"><div style="font-weight:700;padding:8px 0">Ajouter un événement</div>
  ${opt('fiancailles', 'Fiançailles', p.fiancailles >= 1, p.fiancailles >= 1 ? '1/1 · limite atteinte' : '0/1')}
  ${opt('mariage', 'Mariage', gOff, gN)}${opt('circoncision', 'Circoncision', gOff, gN)}${opt('communion', 'Communion', gOff, gN)}
  ${opt('bapteme', 'Baptême', p.baptemes >= 4, p.baptemes + '/4')}${opt('deces', 'Décès (parent 1er degré)', false, p.deces + ' reçu(s)')}
  <select class="f" id="rel" name="rel" aria-label="Parent concerné" style="display:none"><option value="pere">Père</option><option value="mere">Mère</option><option value="enfant">Enfant</option><option value="conjoint">Conjoint(e)</option></select>
  <label class="s" style="display:block;margin-top:12px">Date<input class="f" name="date" type="date" value="${today()}" required></label>
  <button class="b" style="width:100%;margin-top:16px;--c:#15803d;--d:#14532d">Enregistrer l'événement</button></form>
  <div class="s" style="text-align:center">Mariage, circoncision et communion : un seul des trois par membre.</div>`;
}
async function cancelPay(id) {
  if (!confirm('Annuler la validation de cette tranche ?')) return;
  const { data, error } = await SB.from('amicale_tranches').delete().eq('id', id).select();
  if (error || !data.length) alert(error ? error.message : "Annulation impossible : exécute d'abord le fichier 6-tranches-hors-caisse.sql dans Supabase.");
  fill();
}
async function addEvent(e) {
  e.preventDefault(); const f = new FormData(e.target), k = f.get('k');
  const row = { member_id: EVM, kind: k, event_date: f.get('date') }; if (k === 'deces') row.relative = f.get('rel');
  const { error } = await SB.from('amicale_events').insert(row);
  if (error) { alert(error.message); return; }
  alert('Événement enregistré.'); fill();
}
async function delEvent(id) {
  if (!confirm('Supprimer cet événement ? Le compteur du membre sera recalculé.')) return;
  const { error } = await SB.from('amicale_events').delete().eq('id', id);
  if (error) alert(error.message); fill();
}

let NEWPH = '';
function pickPhoto(inp) {
  const f = inp.files[0]; if (!f) { NEWPH = ''; return; }
  const r = new FileReader();
  r.onload = () => { const im = new Image(); im.onload = () => {
    const k = Math.min(1, 480 / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    NEWPH = c.toDataURL('image/jpeg', .78); $('#pp').innerHTML = `<img src="${NEWPH}" alt="Aperçu" style="max-width:100%;border-radius:12px;margin-top:10px">`;
  }; im.src = r.result; };
  r.readAsDataURL(f);
}
let NEWPDF = null;
function pickPdf(inp) {
  const f = inp.files[0]; NEWPDF = null; $('#pp').innerHTML = '';
  if (!f) return;
  if (f.type !== 'application/pdf') { alert('Choisis un fichier PDF.'); inp.value = ''; return; }
  if (f.size > 10 * 1024 * 1024) { alert('PDF trop lourd (10 Mo maximum).'); inp.value = ''; return; }
  NEWPDF = f; $('#pp').innerHTML = `<div class="s" style="margin-top:10px">PDF choisi : ${esc(f.name)}</div>`;
}
async function postsV(k) {
  NEWPH = ''; NEWPDF = null; const cf = PK[k];
  const { data, error } = await SB.from('amicale_posts').select('*').eq('kind', k).order('created_at', { ascending: false }).limit(50);
  if (error) return `<div class="err">${esc(error.message)}</div>`;
  const form = isAdm() ? `<form class="c" onsubmit="addPost(event,'${k}')"><div style="font-weight:700">Ajouter</div>
    ${cf.noTitle ? '' : '<input class="f" name="title" placeholder="Titre" required>'}
    ${cf.ex ? `<input class="f" name="extra" placeholder="${cf.ex}">` : ''}
    <textarea class="f" name="body" rows="${cf.pdf ? 3 : 5}" placeholder="Texte${cf.pdf ? ' (facultatif)' : ''}"${cf.noTitle || cf.pdf ? '' : ' required'}></textarea>
    ${cf.pdf ? '<label class="b sm" style="margin-top:12px;cursor:pointer;--c:#2563eb;--d:#1e3a8a">Ajouter un PDF<input type="file" accept="application/pdf" hidden onchange="pickPdf(this)"></label>'
      : '<label class="b sm" style="margin-top:12px;cursor:pointer;--c:#2563eb;--d:#1e3a8a">Ajouter une photo<input type="file" accept="image/*" hidden onchange="pickPhoto(this)"></label>'}<div id="pp"></div>
    <button class="b" style="width:100%;margin-top:10px;--c:#facc15;--d:#a16207;color:#1c1917;text-shadow:none">Publier</button></form>` : '';
  const cards = (data || []).map(p => {
    const del = isAdm() ? `<div style="margin-top:12px">${btnS('Supprimer', `delPost(${p.id})`, 'red')}</div>` : '';
    const pdf = p.file_url ? `<a class="b sm" href="${esc(p.file_url)}" target="_blank" rel="noopener" style="--c:#2563eb;--d:#1e3a8a;text-decoration:none;margin-top:12px">Ouvrir le PDF</a>` : '';
    const txt = `<div style="min-width:0;flex:1">${p.title ? `<div style="font-weight:700;font-size:16px">${esc(p.title)}</div>` : ''}${p.extra ? `<div class="s" style="margin-top:2px">${esc(p.extra)}</div>` : ''}${p.body ? `<div style="font-size:14px;margin-top:8px;line-height:1.5;white-space:pre-wrap">${esc(p.body)}</div>` : ''}${pdf}<div class="s" style="margin-top:8px">Publié le ${dfr(p.created_at.slice(0, 10))}</div></div>`;
    if (cf.thumb) return `<div class="c"><div style="display:flex;gap:14px">${p.photo ? `<img class="ph" src="${esc(p.photo)}" alt="">` : '<div class="ph">Photo</div>'}${txt}</div>${del}</div>`;
    return `<div class="c">${p.photo ? `<img src="${esc(p.photo)}" alt="" style="width:100%;max-height:300px;object-fit:cover;border-radius:14px;margin-bottom:12px">` : ''}${txt}${del}</div>`;
  }).join('');
  return `${form}${cards || '<div class="c s">Rien n\'a encore été publié ici.</div>'}`;
}
async function addPost(e, k) {
  e.preventDefault(); const f = new FormData(e.target); let file_url = null;
  if (NEWPDF) {
    const path = `${k}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.pdf`;
    const up = await SB.storage.from('amicale-docs').upload(path, NEWPDF, { contentType: 'application/pdf' });
    if (up.error) { alert("Envoi du PDF impossible : " + up.error.message + " (le fichier 5-ajustements.sql a-t-il été exécuté ?)"); return; }
    file_url = SB.storage.from('amicale-docs').getPublicUrl(path).data.publicUrl;
  }
  const { error } = await SB.from('amicale_posts').insert({ kind: k, title: (f.get('title') || '').trim(), body: (f.get('body') || '').trim(), extra: (f.get('extra') || '').trim() || null, photo: NEWPH || null, file_url });
  if (error) alert(error.message); NEWPH = ''; NEWPDF = null; fill();
}
async function delPost(id) {
  if (!confirm('Supprimer cette publication ?')) return;
  const { data: old } = await SB.from('amicale_posts').select('file_url').eq('id', id).maybeSingle();
  const { error } = await SB.from('amicale_posts').delete().eq('id', id);
  if (error) { alert(error.message); return; }
  const u = old && old.file_url, i = u ? u.indexOf('/amicale-docs/') : -1;
  if (i > 0) await SB.storage.from('amicale-docs').remove([decodeURIComponent(u.slice(i + 14))]);
  fill();
}


let MB = {}, PENDING = 0;
async function renameMember(id) {
  const p = MB[id]; if (!p) return;
  const fn = prompt('Prénom', p.first_name); if (fn === null) return;
  const ln = prompt('Nom (tu peux ajouter un numéro, ex. : Sarr N°1)', p.last_name); if (ln === null) return;
  if (!fn.trim() || !ln.trim()) { alert('Le prénom et le nom ne peuvent pas être vides.'); return; }
  const { data, error } = await SB.from('profiles').update({ first_name: fn.trim(), last_name: ln.trim() }).eq('id', id).select();
  if (error || !data.length) alert(error ? error.message : 'Modification impossible.'); fill();
}
async function purge(id) {
  const p = MB[id], nm = p ? p.first_name + ' ' + p.last_name : 'ce compte';
  if (!confirm(`Supprimer définitivement ${nm} ?\nSon compte et tout son historique (tranches, événements) disparaîtront. Cette action est irréversible.`)) return;
  const { error } = await SB.rpc('purge_account', { uid: id });
  if (error) alert(error.message + ' (le fichier 8-suppression-definitive.sql a-t-il été exécuté ?)'); fill();
}
function setBadges() {
  const b = $('#bd-req'), d = $('#bd-dot');
  if (b) { b.textContent = PENDING; b.style.display = PENDING ? 'flex' : 'none'; }
  if (d) d.style.display = PENDING ? 'block' : 'none';
}
async function refreshPending() {
  if (!me || me.status !== 'active' || !isAdm()) return;
  const { count } = await SB.from('profiles').select('id', { count: 'exact', head: true }).eq('status', 'pending');
  PENDING = count || 0; setBadges();
}
setInterval(refreshPending, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshPending(); });

SB.auth.onAuthStateChange(() => {});
boot();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
